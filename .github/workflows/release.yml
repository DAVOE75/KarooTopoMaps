name: Android Release

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cuando creas o publicas un tag que empieza por 'v' (ej. v1.1.0)
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necesario para crear la Release y adjuntar archivos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix gradlew permissions and line endings
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="latest"
          fi
          cp app/build/outputs/apk/release/app-release.apk release_assets/KarooTopoMaps-${TAG_NAME}.apk
          cp app/build/outputs/apk/release/app-release.apk release_assets/KarooTopoMaps.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
